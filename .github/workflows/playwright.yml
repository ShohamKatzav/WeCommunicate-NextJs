name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    # bounceapp/render-action is unmaintained (still declares Node 20) and
    # Render has no official wait action. Poll the public API instead: same
    # secrets, no extra deploy, no Node-runtime warning.
    - name: Wait for Render Deployment
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        retries=40
        wait_seconds=15
        api="https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=20"

        echo "Waiting for Render deploy of ${COMMIT_SHA}"

        for i in $(seq 1 "$retries"); do
          payload="$(curl -fsS \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            "$api")"

          status="$(printf '%s' "$payload" | jq -r --arg sha "$COMMIT_SHA" '
            [.[] | .deploy | select(.commit.id == $sha)] | first | .status // empty
          ')"

          if [ -z "$status" ]; then
            echo "[$i/$retries] No deploy for this commit yet."
          else
            echo "[$i/$retries] Deploy status: $status"
            case "$status" in
              live)
                echo "Render deploy is live."
                exit 0
                ;;
              build_failed|update_failed|canceled|pre_deploy_failed|deactivated)
                echo "Render deploy ended with status: $status"
                exit 1
                ;;
            esac
          fi

          sleep "$wait_seconds"
        done

        echo "Timed out waiting for Render deploy of ${COMMIT_SHA}"
        exit 1

    - uses: pnpm/action-setup@v6
      with:
        version: 10.25.0

    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
      working-directory: ./tests

    - name: Clean old results
      run: rm -rf tests/playwright-report/allure-results

    - name: Run Playwright tests
      run: pnpm test
      continue-on-error: true
      working-directory: ./tests
      env:
        E2E_TEST: true
        TEST_BYPASS_KEY: ${{ secrets.TEST_BYPASS_KEY }}

    - name: Get previous Allure report history
      uses: actions/checkout@v7
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages-dir

    - name: Restore Allure history into results
      if: always()
      run: |
        mkdir -p tests/playwright-report/allure-results/history
        if [ -d "gh-pages-dir/history" ]; then
          cp -R gh-pages-dir/history/. tests/playwright-report/allure-results/history/
          echo "History restored from gh-pages/history."
        elif [ -d "gh-pages-dir/allure-report/history" ]; then
          cp -R gh-pages-dir/allure-report/history/. tests/playwright-report/allure-results/history/
          echo "History restored from gh-pages/allure-report/history."
        else
          echo "No previous Allure history found."
        fi
        ls -la tests/playwright-report/allure-results/history || true

    - name: Add Allure executor metadata
      if: always()
      run: |
        cat > tests/playwright-report/allure-results/executor.json <<EOF
        {
          "name": "GitHub Actions",
          "type": "github",
          "buildOrder": ${{ github.run_number }},
          "buildName": "${{ github.workflow }} #${{ github.run_number }}",
          "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          "reportName": "Allure Report",
          "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/?v=${{ github.run_number }}"
        }
        EOF

    # Traces embed the Next.js client bundle (and cookies/network). Strip them
    # from Allure results before generate so gh-pages never gets the zips.
    - name: Strip Playwright traces from Allure results
      if: always()
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import json

        results_dir = Path("tests/playwright-report/allure-results")
        results_dir.mkdir(parents=True, exist_ok=True)

        def is_trace_zip(att):
            if not isinstance(att, dict):
                return False
            name = str(att.get("name") or "").lower()
            source = str(att.get("source") or "").lower()
            typ = str(att.get("type") or "").lower()
            if source.endswith(".zip"):
                return True
            if "playwright-trace" in typ:
                return True
            if name == "trace" or name.endswith(".zip"):
                return True
            return False

        def strip_attachments(obj, removed):
            if isinstance(obj, dict):
                atts = obj.get("attachments")
                if isinstance(atts, list):
                    kept = []
                    for att in atts:
                        if is_trace_zip(att):
                            removed.append(att)
                            source = att.get("source")
                            if source:
                                path = results_dir / source
                                if path.is_file():
                                    path.unlink()
                        else:
                            kept.append(att)
                    obj["attachments"] = kept
                for value in obj.values():
                    strip_attachments(value, removed)
            elif isinstance(obj, list):
                for item in obj:
                    strip_attachments(item, removed)

        removed = []
        for pattern in ("*-result.json", "*-container.json"):
            for json_path in results_dir.glob(pattern):
                data = json.loads(json_path.read_text(encoding="utf-8"))
                strip_attachments(data, removed)
                json_path.write_text(
                    json.dumps(data, ensure_ascii=False),
                    encoding="utf-8",
                )

        leftover = list(results_dir.rglob("*.zip"))
        for zip_path in leftover:
            zip_path.unlink()

        print(
            f"Removed {len(removed)} trace attachment(s) from Allure results JSON; "
            f"deleted {len(leftover)} leftover zip file(s)."
        )
        PY

    - name: Generate Allure Report
      if: always()
      run: pnpm run allure:report

    - name: Prepare report for Pages
      if: always()
      run: |
        REPORT_DIR=tests/playwright-report/allure-report
        test -f "$REPORT_DIR/index.html"
        touch "$REPORT_DIR/.nojekyll"
        echo "${{ github.run_number }}" > "$REPORT_DIR/build.txt"
        python3 - <<'PY'
        from pathlib import Path
        index = Path("tests/playwright-report/allure-report/index.html")
        html = index.read_text(encoding="utf-8")
        run = "${{ github.run_number }}"
        meta = (
            '<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />'
            '<meta http-equiv="Pragma" content="no-cache" />'
        )
        if "Cache-Control" not in html:
            html = html.replace("<head>", "<head>" + meta, 1)
        html = html.replace("<title>Allure Report</title>", f"<title>Allure Report #{run}</title>")
        index.write_text(html, encoding="utf-8")
        PY

    - name: Scan Allure report for leaked Google API keys
      id: scan
      if: always()
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import re
        import sys

        report = Path("tests/playwright-report/allure-report")
        if not report.is_dir():
            print("Allure report directory missing; refusing to publish.")
            sys.exit(1)

        zip_files = sorted(
            p.relative_to(report).as_posix()
            for p in report.rglob("*.zip")
            if p.is_file()
        )
        if zip_files:
            print("Refusing to publish: zip attachments still present in Allure report:")
            for rel in zip_files:
                print(f"  {rel}")
            sys.exit(1)

        pattern = re.compile(rb"AIza[0-9A-Za-z_-]{20,}")
        leaked = []
        for path in report.rglob("*"):
            if not path.is_file():
                continue
            try:
                data = path.read_bytes()
            except OSError:
                continue
            if pattern.search(data):
                leaked.append(path.relative_to(report).as_posix())

        if leaked:
            print("Refusing to publish: Google API key pattern found in Allure report:")
            for rel in leaked:
                print(f"  {rel}")
            sys.exit(1)

        print("Allure report scan passed.")
        PY

    - name: Persist Allure report history
      if: always() && steps.scan.outcome == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        REPORT_DIR=tests/playwright-report/allure-report
        test -f "$REPORT_DIR/index.html"
        workdir="$(mktemp -d)"
        cp -R "$REPORT_DIR"/. "$workdir/"
        cd "$workdir"
        git init
        git checkout --orphan gh-pages
        git add -A
        git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Allure report ${{ github.run_number }}"
        git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
        git push --force origin HEAD:gh-pages

    - uses: actions/upload-artifact@v7
      if: always() && steps.scan.outcome == 'success'
      with:
        name: allure-report
        path: tests/playwright-report/allure-report
        include-hidden-files: true
        retention-days: 30

  publish-report:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
    - uses: actions/download-artifact@v7
      with:
        name: allure-report
        path: tests/playwright-report

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v6

    - name: Upload report to GitHub Pages
      uses: actions/upload-pages-artifact@v5
      with:
        path: tests/playwright-report/allure-report
        include-hidden-files: true

    - name: Deploy report to GitHub Pages
      uses: actions/deploy-pages@v5
      id: deployment

    - name: Add Allure link to Job Summary
      run: |
        echo "### 📊 [View Allure Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/?v=${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
