name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v7

    - name: Wait for Render Deployment
      uses: bounceapp/render-action@0.12.0
      with:
        render-token: ${{ secrets.RENDER_API_KEY }}
        service-id: ${{ secrets.RENDER_SERVICE_ID }}
        retries: 40
        wait: 15000

    - uses: pnpm/action-setup@v4
      with:
        version: 10.25.0

    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
      working-directory: ./tests

    - name: Clean old results
      run: rm -rf tests/playwright-report/allure-results

    - name: Run Playwright tests
      run: pnpm test
      continue-on-error: true
      working-directory: ./tests
      env:
        E2E_TEST: true
        TEST_BYPASS_KEY: ${{ secrets.TEST_BYPASS_KEY }}

    - name: Get previous Allure report history
      uses: actions/checkout@v7
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages-dir

    - name: Restore Allure history into results
      if: always()
      run: |
        mkdir -p tests/playwright-report/allure-results/history
        if [ -d "gh-pages-dir/history" ]; then
          cp -R gh-pages-dir/history/. tests/playwright-report/allure-results/history/
          echo "History restored from gh-pages/history."
        elif [ -d "gh-pages-dir/allure-report/history" ]; then
          cp -R gh-pages-dir/allure-report/history/. tests/playwright-report/allure-results/history/
          echo "History restored from gh-pages/allure-report/history."
        else
          echo "No previous Allure history found."
        fi
        ls -la tests/playwright-report/allure-results/history || true

    - name: Add Allure executor metadata
      if: always()
      run: |
        cat > tests/playwright-report/allure-results/executor.json <<EOF
        {
          "name": "GitHub Actions",
          "type": "github",
          "buildOrder": ${{ github.run_number }},
          "buildName": "${{ github.workflow }} #${{ github.run_number }}",
          "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          "reportName": "Allure Report",
          "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/?v=${{ github.run_number }}"
        }
        EOF

    - name: Generate Allure Report
      if: always()
      run: pnpm run allure:report

    - name: Prepare report for Pages
      if: always()
      run: |
        REPORT_DIR=tests/playwright-report/allure-report
        test -f "$REPORT_DIR/index.html"
        touch "$REPORT_DIR/.nojekyll"
        echo "${{ github.run_number }}" > "$REPORT_DIR/build.txt"
        python3 - <<'PY'
        from pathlib import Path
        index = Path("tests/playwright-report/allure-report/index.html")
        html = index.read_text(encoding="utf-8")
        run = "${{ github.run_number }}"
        meta = (
            '<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />'
            '<meta http-equiv="Pragma" content="no-cache" />'
        )
        if "Cache-Control" not in html:
            html = html.replace("<head>", "<head>" + meta, 1)
        html = html.replace("<title>Allure Report</title>", f"<title>Allure Report #{run}</title>")
        index.write_text(html, encoding="utf-8")
        PY

    - name: Persist Allure report history
      if: always() && github.event_name != 'pull_request'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: tests/playwright-report/allure-report
        force_orphan: true

    - name: Post Allure Report link
      if: always() && github.event_name == 'pull_request'
      uses: thollander/actions-comment-pull-request@v2
      with:
        message: |
          ### 📊 Test Report Generated
          The Allure report is available in the `playwright-report` workflow artifact.
        comment_tag: allure_report_link

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: tests/playwright-report/
        include-hidden-files: true
        retention-days: 30

  publish-report:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
    - uses: actions/download-artifact@v7
      with:
        name: playwright-report
        path: tests/playwright-report

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v6

    - name: Upload report to GitHub Pages
      uses: actions/upload-pages-artifact@v5
      with:
        path: tests/playwright-report/allure-report
        include-hidden-files: true

    - name: Deploy report to GitHub Pages
      uses: actions/deploy-pages@v5
      id: deployment

    - name: Add Allure link to Job Summary
      run: |
        echo "### 📊 [View Allure Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/?v=${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
