<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - WeCommunicate</title>
    <link rel="icon" href="/favicon.ico">
    <script>
        // This page is served straight from the service worker's cache, outside
        // React/next-themes entirely, so it can't read the app's ThemeProvider -
        // but it CAN read the same localStorage key next-themes writes to
        // (see app/context/themeProvider.tsx), so a light/dark/system choice
        // made in the app is still honoured here instead of this page always
        // showing one hardcoded theme regardless of what was picked. Blocking
        // script in <head>, before the stylesheet below paints anything, for
        // the same no-flash reason the app's own theme script runs this early.
        (function () {
            try {
                var stored = localStorage.getItem('theme');
                var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.classList.add('dark');
            } catch (e) { }
        })();
    </script>
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: linear-gradient(to bottom right, #f9fafb, #e0f2fe);
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
        }

        .dark body {
            background: linear-gradient(to bottom right, #111827, #1e293b);
            color: #f9fafb;
        }

        /* text-4xl sm:text-5xl in offlinePage.tsx's React version - "Reduced
           size for better mobile fit" there per its own comment, which this
           page (more likely than most to actually be opened on a phone)
           wasn't doing at any width. */
        h1 {
            margin-top: 1.5rem;
            font-size: 2.25rem;
            font-weight: 800;
        }

        /* text-base sm:text-lg in the React version. */
        p {
            margin-top: 1rem;
            font-size: 1rem;
        }

        @media (min-width: 640px) {
            h1 {
                font-size: 3rem;
            }

            p {
                font-size: 1.125rem;
            }
        }

        p.italic {
            font-style: italic;
            font-size: 0.875rem;
            /* #6b7280 (gray-500) was 4.21:1 against the light gradient's
               lighter stop (#e0f2fe) - under the 4.5:1 this normal-size text
               needs. */
            color: #4a5565;
        }

        .dark p.italic {
            color: #9ca3af;
        }

        .status {
            margin-top: 1.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: 500;
            display: inline-block;
        }

        .status.online {
            background-color: #dcfce7;
            color: #166534;
        }

        .status.offline {
            background-color: #fee2e2;
            color: #991b1b;
        }

        /* Matches offlinePage.tsx's dark: pair for the same pill (the
           moderator page's status-badge pattern: light pastel bg/dark text,
           dark saturated bg/light text). */
        .dark .status.online {
            background-color: #14532d;
            color: #bbf7d0;
        }

        .dark .status.offline {
            background-color: #7f1d1d;
            color: #fecaca;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            border-radius: 1rem;
            font-weight: 600;
            margin-top: 2rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .button.retry {
            background-color: #2563eb;
            color: white;
        }

        .button.retry:hover {
            background-color: #1d4ed8;
        }

        .button.retry:disabled {
            background-color: #6b7280;
            cursor: not-allowed;
        }

        /* Fixed regardless of theme, matching app/components/offlinePage.tsx's
           React version (bg-gray-700/text-gray-100/border-gray-600, no dark:
           pair) - this used to be a light button in light mode and only
           picked up the dark styling under .dark, unlike the React page. */
        .button.back {
            background-color: #374151;
            color: #f3f4f6;
            border: 1px solid #4b5563;
        }

        .button.back:hover {
            background-color: #4b5563;
        }

        ul {
            margin-top: 3rem;
            list-style: disc;
            text-align: left;
            max-width: 20rem;
            padding-left: 1.25rem;
            color: inherit;
        }

        ul li {
            margin-bottom: 0.5rem;
        }

        .icon {
            width: 6rem;
            height: 6rem;
            margin: auto;
        }

        /* The SVGs use stroke="currentColor" with no color of their own, so
           this is what actually tints them - matching offlinePage.tsx's
           React version (text-success/text-muted-foreground on the <svg>).
           Previously unset here, so both states just inherited body's text
           color instead of ever turning green. Light-mode values are
           app/globals.css's --success/--muted-foreground light values
           (green-400/gray-400 - the plain Tailwind shade - fails the 3:1
           non-text contrast minimum against this page's light background,
           same reason those tokens exist instead of the obvious shade). */
        .icon.online {
            color: #15803d;
        }

        .icon.offline {
            color: #4b5563;
        }

        .dark .icon.online {
            color: #4ade80;
        }

        .dark .icon.offline {
            color: #9ca3af;
        }

        .animate-bounce {
            animation: bounce 1s infinite;
        }

        .animate-pulse {
            animation: pulse 1.5s infinite;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            animation: slideDown 0.3s ease;
        }

        /* -600/-700, not the lighter -400/-500 shades these are usually
           reached for: white text on the lighter ones was as low as
           2.5:1 here (emerald-500), well under the 4.5:1 this text needs. */
        .toast.error {
            background-color: #c10007;
            color: white;
        }

        .toast.success {
            background-color: #007a55;
            color: white;
        }

        .toast.info {
            background-color: #1447e6;
            color: white;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        @keyframes slideDown {
            from {
                transform: translate(-50%, -100%);
                opacity: 0;
            }

            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }

        .redirect-message {
            margin-top: 1rem;
            font-size: 0.875rem;
            /* emerald-500 (#10b981) was 2.43:1 against the light background -
               emerald-700 clears 4.5:1 there, but is too dark to read against
               the dark background in turn, hence the .dark override below. */
            color: #007a55;
            font-weight: 600;
        }

        .dark .redirect-message {
            color: #05df72;
        }
    </style>
</head>

<body>

    <div id="status-icon" class="icon animate-bounce offline">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2 12h20M2 6h20M2 18h20" />
        </svg>
    </div>

    <h1 id="status-text">You're offline <span aria-hidden="true">📡</span></h1>

    <p id="description-text">Looks like you've lost your <strong>internet connection</strong></p>
    <p class="italic">"Sometimes you need to disconnect to reconnect." — Anonymous</p>

    <div id="redirect-message" class="redirect-message" style="display: none;"></div>

    <div id="connection-indicator" class="status offline">✗ No connection</div>

    <div>
        <button id="retry-btn" class="button retry">🔄 Retry connection</button>
        <button id="back-btn" class="button back">❌ Go back</button>
    </div>

    <ul>
        <li>Check your WiFi or mobile data</li>
        <li>Try airplane mode on/off</li>
        <li>Some features may be cached and still work</li>
    </ul>

    <script>
        (function () {
            const statusIcon = document.getElementById('status-icon');
            const statusText = document.getElementById('status-text');
            const descriptionText = document.getElementById('description-text');
            const connectionIndicator = document.getElementById('connection-indicator');
            const retryBtn = document.getElementById('retry-btn');
            const backBtn = document.getElementById('back-btn');
            const redirectMessage = document.getElementById('redirect-message');

            let redirectTimer = null;

            // Show toast notification
            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                document.body.appendChild(toast);

                setTimeout(() => {
                    toast.style.animation = 'slideDown 0.3s ease reverse';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            // Probe the network by requesting a small uncached endpoint
            async function probeNetwork(timeout = 1500) {
                const controller = new AbortController();
                const id = setTimeout(() => controller.abort(), timeout);
                try {
                    const res = await fetch('/api/health', { method: 'GET', cache: 'no-store', signal: controller.signal });
                    clearTimeout(id);
                    return res.ok;
                } catch (e) {
                    clearTimeout(id);
                    return false;
                }
            }

            // Update UI based on an actual probe result rather than relying solely on navigator.onLine
            async function updateStatus() {
                const online = await probeNetwork();

                if (online) {
                    statusText.textContent = "You're back online! 🎉";
                    descriptionText.innerHTML = 'Your <strong>internet connection</strong> has been restored';

                    statusIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                    </svg>`;
                    statusIcon.className = "icon animate-pulse online";

                    connectionIndicator.textContent = "✓ Connected";
                    connectionIndicator.className = "status online";

                    retryBtn.disabled = false;
                } else {
                    // Same antenna treatment as the initial markup above and
                    // offlinePage.tsx's React version ("You're offline 📡") -
                    // this used to drop the emoji on every status refresh,
                    // including the very first one on page load.
                    statusText.innerHTML = 'You\'re offline <span aria-hidden="true">📡</span>';
                    descriptionText.innerHTML = 'Looks like you\'ve lost your <strong>internet connection</strong>';

                    statusIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2 12h20M2 6h20M2 18h20"/>
                    </svg>`;
                    statusIcon.className = "icon animate-bounce offline";

                    connectionIndicator.textContent = "✗ No connection";
                    connectionIndicator.className = "status offline";

                    redirectMessage.style.display = 'none';
                    if (redirectTimer) {
                        clearTimeout(redirectTimer);
                        redirectTimer = null;
                    }
                }
            }

            // Handle online event
            function handleOnline() {
                updateStatus();
                showToast("Connection restored! Redirecting...", "success");

                // Show countdown message
                let countdown = 3;
                redirectMessage.textContent = `Redirecting in ${countdown} seconds...`;
                redirectMessage.style.display = 'block';

                const countdownInterval = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        redirectMessage.textContent = `Redirecting in ${countdown} seconds...`;
                    } else {
                        clearInterval(countdownInterval);
                    }
                }, 1000);

                // Redirect after 3 seconds
                redirectTimer = setTimeout(() => {
                    window.location.href = '/chat';
                }, 3000);
            }

            // Handle offline event
            function handleOffline() {
                updateStatus();
                showToast("Connection lost", "error");
            }

            // Retry button click handler
            function handleRetry() {
                if (navigator.onLine) {
                    showToast("Redirecting...", "info");
                    retryBtn.disabled = true;
                    retryBtn.textContent = "⏳ Redirecting...";
                    setTimeout(() => {
                        window.location.href = '/chat';
                    }, 500);
                } else {
                    showToast("Still offline. Please check your connection.", "error");
                }
            }

            // Back button click handler
            function handleBack() {
                window.history.back();
            }

            // Initial status update
            updateStatus();

            // Add event listeners
            window.addEventListener('online', handleOnline);
            window.addEventListener('offline', handleOffline);
            retryBtn.addEventListener('click', handleRetry);
            backBtn.addEventListener('click', handleBack);

            // Cleanup on page unload (good practice for SPAs)
            window.addEventListener('beforeunload', () => {
                window.removeEventListener('online', handleOnline);
                window.removeEventListener('offline', handleOffline);
                if (redirectTimer) {
                    clearTimeout(redirectTimer);
                }
            });
        })();
    </script>
</body>

</html>
